version: '3.8'

services:
  # Reverse Proxy and Load Balancer
  traefik:
    image: traefik:v2.10
    container_name: wphub-traefik
    command:
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
    ports:
      - '${TRAEFIK_HTTP_PORT:-80}:80'
      - '${TRAEFIK_DASHBOARD_PORT:-8080}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - wphub-network

  # Database Engine
  postgres:
    image: postgres:16-alpine
    container_name: wphub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: wphub_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - wphub-network

  # Cache and Jobs Queue Broker
  redis:
    image: redis:7-alpine
    container_name: wphub-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - wphub-network

  # S3-compatible Object Storage for Backups
  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: wphub-minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - wphub-network

networks:
  wphub-network:
    name: wphub-network
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
